name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Parse
        run: |
          for f in bin/omapass bin/omapass-setup bin/omapass-reset \
                   lib/config.sh install.sh scripts/release.sh tests/smoke.sh; do
            bash -n "$f"
          done

      - name: Shellcheck
        run: |
          shellcheck --severity=warning \
            bin/omapass bin/omapass-setup bin/omapass-reset \
            lib/config.sh install.sh scripts/release.sh tests/smoke.sh

  smoke:
    name: smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pass and gnupg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pass jq

      - name: Run the smoke test
        run: ./tests/smoke.sh

      - name: Run the entry round-trip matrix
        run: ./tests/entries.sh

  qml:
    name: qml syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-declarative-dev-tools

      - name: Locate qmlformat
        id: tool
        # Ubuntu keeps the Qt 6 tools out of PATH, so resolve rather than assume.
        # Failing loudly beats a check that quietly never runs.
        run: |
          for candidate in qmlformat qmlformat6 /usr/lib/qt6/bin/qmlformat \
                           /usr/lib/x86_64-linux-gnu/qt6/bin/qmlformat; do
            if command -v "$candidate" >/dev/null 2>&1 || [[ -x $candidate ]]; then
              echo "bin=$candidate" >> "$GITHUB_OUTPUT"
              echo "found: $candidate"
              exit 0
            fi
          done
          echo "::error::qmlformat not found after installing qt6-declarative-dev-tools"
          dpkg -L qt6-declarative-dev-tools 2>/dev/null | grep -iE 'bin/' || true
          exit 1

      - name: Parse every QML file
        # qmlformat, not qmllint: qs.Commons and qs.Ui only resolve inside the
        # Omarchy shell, and older qmllint treats an unresolved import as an
        # error, so it fails every file here regardless of syntax. qmlformat is
        # a pure parser — it ignores imports and still rejects real syntax
        # errors, which is the part CI can meaningfully check.
        run: |
          status=0
          for f in *.qml; do
            if ! "${{ steps.tool.outputs.bin }}" "$f" >/dev/null 2>&1; then
              echo "::error file=$f::does not parse"
              "${{ steps.tool.outputs.bin }}" "$f" || true
              status=1
            fi
          done
          if [[ $status -eq 0 ]]; then
            echo "all $(ls -1 ./*.qml | wc -l) QML files parse"
          fi
          exit $status

  manifest:
    name: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json
        run: |
          python3 - <<'PY'
          import json, os, sys

          manifest = json.load(open("manifest.json"))

          required = ["schemaVersion", "id", "name", "version", "kinds", "entryPoints"]
          missing = [k for k in required if k not in manifest]
          assert not missing, f"manifest.json is missing {missing}"
          assert manifest["schemaVersion"] == 1, "unsupported schemaVersion"

          for kind, path in manifest["entryPoints"].items():
              assert os.path.isfile(path), f"entryPoint {kind} -> {path} does not exist"
              assert not path.startswith("/") and ".." not in path, f"unsafe entryPoint {path}"

          import re
          assert re.fullmatch(r"\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?", manifest["version"]), \
              f"version {manifest['version']!r} is not semver"

          print("manifest.json ok:", manifest["id"], manifest["version"])
          PY
